name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Generate wrapper and build APK
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            for name in ANDROID_DEBUG_KEYSTORE_PASSWORD ANDROID_DEBUG_KEY_ALIAS ANDROID_DEBUG_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "Missing GitHub Actions secret: $name"
                exit 1
              fi
            done
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clarity-debug-signing.jks"
            export ANDROID_DEBUG_KEYSTORE_PATH="$RUNNER_TEMP/clarity-debug-signing.jks"
            export ANDROID_DEBUG_KEYSTORE_PASSWORD ANDROID_DEBUG_KEY_ALIAS ANDROID_DEBUG_KEY_PASSWORD
          elif [ -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD$ANDROID_DEBUG_KEY_ALIAS$ANDROID_DEBUG_KEY_PASSWORD" ]; then
            echo "Set all debug signing secrets, including ANDROID_DEBUG_KEYSTORE_BASE64, or leave them all unset."
            exit 1
          else
            echo "::warning::No stable debug keystore configured; Google OAuth may reject this runner-generated debug certificate."
          fi
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/dark_todo.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-todo-debug-apk
          path: app/build/outputs/apk/debug/dark_todo.apk
          if-no-files-found: error
          retention-days: 14

